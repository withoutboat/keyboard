layout:
  qmk_keyboard: crkbd/rev1
  layout:
    name: LAYOUT_split_3x6_3

layers:
  "Base (EN / RU)":
    - [Esc,   {t: "Q", sub: "Й"}, {t: "W", sub: "Ц"}, {t: "E", sub: "У"}, {t: "R", sub: "К"}, {t: "T", sub: "Е"},    {t: "Y", sub: "Н"}, {t: "U", sub: "Г"}, {t: "I", sub: "Ш"}, {t: "O", sub: "Щ"}, {t: "P", sub: "З"},   Bspc]
    - [Tab,   {t: "A", sub: "Ф"}, {t: "S", sub: "Ы"}, {t: "D", sub: "В"}, {t: "F", sub: "А"}, {t: "G", sub: "П"},    {t: "H", sub: "Р"}, {t: "J", sub: "О"}, {t: "K", sub: "Л"}, {t: "L", sub: "Д"}, {t: ";", sub: "Ж"},  {t: "Lang", h: "F24"}]
    - [Shift, {t: "Z", sub: "Я"}, {t: "X", sub: "Ч"}, {t: "C", sub: "С"}, {t: "V", sub: "М"}, {t: "B", sub: "И"},    {t: "N", sub: "Т"}, {t: "M", sub: "Ь"}, {t: ",", sub: "Б"}, {t: ".", sub: "Ю"}, {t: "/", sub: "."},  Shift]
    - [Ctrl,  Win, Space,                                                                                              Enter,            {t: "Fn", h: "Num"}, {t: "Ctrl", h: "Sym"}]

  "Lower (Num & Ru: Х Ъ Ё)":
    - [{t: "`", sub: "Ё"}, 1, 2, 3, 4, 5,    6, 7, 8, 9, 0, Del]
    - [Trans, Trans, Trans, Trans, Trans, Trans,    {t: "[", sub: "Х"}, {t: "]", sub: "Ъ"}, '=', '-', '\\', Trans]
    - [Trans, Trans, Trans, Trans, Trans, Trans,    Trans, Trans, Trans, Trans, Trans, Trans]
    - [Trans, Trans, Trans,                         Trans, Trans, Trans]

  "Raise (Nav & Media)":
    - [F1,    F2,   F3,   F4,   F5,   F6,     F7,    F8,     F9,   F10,  F11,   F12]
    - [Trans, Left, Down, Up,   Right, Home,   PgUp,  Left,   Down, Up,   Right, Trans]
    - [Trans, Trans, Mute, VolDown, VolUp, End,    PgDn,  Prev,   Play, Next,  Trans, Trans]
    - [Trans, Trans, Trans,                    Trans, Trans,  Trans]
