# Keymap definition for Corne / W-Corne (3x6 + 3 thumb keys per half)
# Visualized automatically via keymap-drawer (GitHub Actions)

layout:
  qmk_keyboard: crkbd/rev1
  layout:
    name: LAYOUT_split_3x6_3

layers:
  Base (QWERTY):
    - [Esc,   Q, W, E, R, T,    Y, U, I,     O,   P,    Bspc]
    - [Tab,   A, S, D, F, G,    H, J, K,     L,   ';',  {t: "Lang", h: "F24"}]
    - [Shift, Z, X, C, V, B,    N, M, ',',   '.', '/',  Shift]
    - [Ctrl,  Win, Space,       Enter, Fn, Ctrl]

  Lower (Nav & Num):
    - ['`',   1, 2, 3, 4, 5,    6,    7,    8,     9,     0,     Del]
    - [Trans, Left, Down, Up, Right, Home,  PgUp,  Minus, '=',   '[',   ']',   '\\']
    - [Trans, Trans, Trans, Trans, Trans, End,   PgDn,  Trans, Trans, Trans, Trans, Trans]
    - [Trans, Trans, Trans,     Trans, Trans, Trans]

  Raise (Symbols):
    - ['~',   '!', '@', '#', '$', '%',   '^', '&', '*', '(', ')', Del]
    - [Trans, Trans, Trans, Trans, Trans, Trans,  Left, Down, Up, Right, Trans, Trans]
    - [Trans, Trans, Trans, Trans, Trans, Trans,  Trans, Trans, Trans, Trans, Trans, Trans]
    - [Trans, Trans, Trans,     Trans, Trans, Trans]
